<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Pretendard">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4b5c"/>
    </marker>
    <marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>

  <!-- 화살표: 공급 방향(위 → 아래) -->
  <line x1="300" y1="82" x2="300" y2="124" stroke="#3d4b5c" stroke-width="2" marker-end="url(#ar)"/>
  <text x="312" y="108" font-size="14" fill="#5b6b7b">순환수</text>
  <path d="M300,182 L300,206 L160,206 L160,242" fill="none" stroke="#b45309" stroke-width="3" marker-end="url(#arA)"/>
  <path d="M300,206 L440,206 L440,242" fill="none" stroke="#3d4b5c" stroke-width="2" marker-end="url(#ar)"/>
  <text x="312" y="200" font-size="14" fill="#5b6b7b">냉각수</text>
  <path d="M160,316 L160,336 L80,336 L80,372" fill="none" stroke="#b45309" stroke-width="3" marker-end="url(#arA)"/>
  <path d="M160,336 L230,336 L230,372" fill="none" stroke="#b45309" stroke-width="3" marker-end="url(#arA)"/>
  <path d="M440,316 L440,336 L370,336 L370,372" fill="none" stroke="#3d4b5c" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M440,336 L520,336 L520,372" fill="none" stroke="#3d4b5c" stroke-width="2" marker-end="url(#ar)"/>
  <text x="242" y="358" font-size="14" fill="#5b6b7b">절삭유 냉각수</text>

  <!-- 순환 펌프 -->
  <rect x="210" y="24" width="180" height="58" rx="10" fill="#f3f5f8" stroke="#c9d1db" stroke-width="1.5"/>
  <text x="300" y="49" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1c1e">P-01</text>
  <text x="300" y="71" text-anchor="middle" font-size="14" fill="#5b6b7b">냉각탑 순환 펌프</text>
  <!-- 냉각탑 -->
  <rect x="210" y="124" width="180" height="58" rx="10" fill="#f3f5f8" stroke="#c9d1db" stroke-width="1.5"/>
  <text x="300" y="149" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1c1e">CT-01</text>
  <text x="300" y="171" text-anchor="middle" font-size="14" fill="#5b6b7b">냉각탑 · 1~4호기 공용</text>

  <!-- 칠러 1호: 먼저 볼 곳 -->
  <rect x="60" y="242" width="200" height="74" rx="10" fill="#fdf1e3" stroke="#b45309" stroke-width="2.5"/>
  <text x="160" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">CLT-01 절삭유 칠러 1호</text>
  <text x="160" y="290" text-anchor="middle" font-size="14" fill="#1c1c1e">1·2호기만 공급</text>
  <text x="160" y="308" text-anchor="middle" font-size="14" fill="#1c1c1e">알람 없음</text>
  <!-- 칠러 2호 -->
  <rect x="350" y="242" width="180" height="74" rx="10" fill="#f3f5f8" stroke="#c9d1db" stroke-width="1.5"/>
  <text x="440" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1c1e">CLT-02 칠러 2호</text>
  <text x="440" y="290" text-anchor="middle" font-size="14" fill="#5b6b7b">3·4호기 공급</text>

  <!-- 가공기 -->
  <rect x="20" y="372" width="120" height="64" rx="10" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="80" y="398" text-anchor="middle" font-size="15" font-weight="700" fill="#c62828">1호기</text>
  <text x="80" y="420" text-anchor="middle" font-size="14" fill="#1c1c1e">스핀들 온도 알람</text>
  <rect x="170" y="372" width="120" height="64" rx="10" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="230" y="398" text-anchor="middle" font-size="15" font-weight="700" fill="#c62828">2호기</text>
  <text x="230" y="420" text-anchor="middle" font-size="14" fill="#1c1c1e">스핀들 온도 알람</text>
  <rect x="310" y="372" width="120" height="64" rx="10" fill="#ffffff" stroke="#c9d1db" stroke-width="1.5"/>
  <text x="370" y="398" text-anchor="middle" font-size="15" font-weight="700" fill="#5b6b7b">3호기</text>
  <text x="370" y="420" text-anchor="middle" font-size="14" fill="#5b6b7b">정상</text>
  <rect x="460" y="372" width="120" height="64" rx="10" fill="#ffffff" stroke="#c9d1db" stroke-width="1.5"/>
  <text x="520" y="398" text-anchor="middle" font-size="15" font-weight="700" fill="#5b6b7b">4호기</text>
  <text x="520" y="420" text-anchor="middle" font-size="14" fill="#5b6b7b">정상</text>

  <!-- 오른쪽: 도구 결과 -->
  <rect x="620" y="24" width="320" height="300" rx="10" fill="#f3f5f8" stroke="#c9d1db" stroke-width="1.5"/>
  <text x="640" y="56" font-size="15" font-weight="700" fill="#1c1c1e">AI가 부른 도구</text>
  <text x="640" y="88" font-family="D2Coding" font-size="15" fill="#0f766e">trace_common_upstream(</text>
  <text x="656" y="110" font-family="D2Coding" font-size="15" fill="#0f766e">["1호기", "2호기"])</text>
  <line x1="640" y1="128" x2="920" y2="128" stroke="#c9d1db" stroke-width="1"/>
  <text x="640" y="156" font-size="14" fill="#5b6b7b">두 대가 함께 쓰는 냉각 계통</text>
  <g font-size="15" font-weight="700" fill="#b45309"><text x="640" y="186" font-family="D2Coding">CLT-01</text><text x="716" y="186">칠러 1호</text><text x="840" y="186">1단계 위</text></g>
  <g font-size="15" font-weight="400" fill="#1c1c1e"><text x="640" y="212" font-family="D2Coding">CT-01</text><text x="716" y="212">냉각탑</text><text x="840" y="212">2단계 위</text></g>
  <g font-size="15" font-weight="400" fill="#1c1c1e"><text x="640" y="238" font-family="D2Coding">P-01</text><text x="716" y="238">순환 펌프</text><text x="840" y="238">3단계 위</text></g>
  <line x1="640" y1="258" x2="920" y2="258" stroke="#c9d1db" stroke-width="1"/>
  <text x="640" y="284" font-size="14" fill="#1c1c1e">냉각탑은 정상인 3·4호기도 쓴다</text>
  <text x="640" y="306" font-size="14" font-weight="700" fill="#b45309">→ 칠러 1호부터 본다</text>

  <!-- 범례 -->
  <rect x="620" y="384" width="18" height="18" rx="4" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
  <text x="646" y="399" font-size="14" fill="#5b6b7b">알람이 뜬 설비</text>
  <rect x="770" y="384" width="18" height="18" rx="4" fill="#fdf1e3" stroke="#b45309" stroke-width="1.5"/>
  <text x="796" y="399" font-size="14" fill="#5b6b7b">먼저 볼 상류</text>
  <rect x="620" y="414" width="18" height="18" rx="4" fill="#f3f5f8" stroke="#c9d1db" stroke-width="1.5"/>
  <text x="646" y="429" font-size="14" fill="#5b6b7b">상류 설비 (화살표는 공급 방향)</text>
</svg>
